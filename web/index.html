<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人 RAG 知识库助手</title>
<style>
  :root {
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --border: #E3E2DE;
    --text: #2C2C2A;
    --muted: #6B6A66;
    --accent: #534AB7;
    --accent-soft: #EEEDFE;
    --danger: #A32D2D;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .app {
    max-width: 860px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 0 14px;
    border-bottom: 0.5px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 500; margin: 0; margin-right: auto; }
  header .status { font-size: 12px; color: var(--muted); min-width: 64px; text-align: right; }
  header button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 8px;
    border: 0.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  header button:hover { border-color: var(--accent); color: var(--accent); }
  header button:disabled { opacity: 0.5; cursor: not-allowed; }
  header button.warn { border-color: var(--danger); color: var(--danger); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .hint {
    border: 0.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .hint code {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 12px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; }
  .msg.assistant .bubble {
    background: var(--surface);
    border: 0.5px solid var(--border);
    max-width: 100%;
    width: 100%;
  }
  .citations { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .citations .label { font-size: 12px; color: var(--muted); }
  details {
    border: 0.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    padding: 8px 12px;
  }
  details summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--accent);
    outline: none;
  }
  details summary .src { color: var(--text); font-weight: 500; }
  details summary .loc { color: var(--muted); }
  details pre {
    margin: 10px 0 2px;
    white-space: pre-wrap;
    word-break: break-word;
    font: 12px/1.6 inherit;
    color: var(--muted);
  }
  footer {
    padding: 14px 0 20px;
    border-top: 0.5px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    padding: 11px 14px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    max-height: 140px;
  }
  textarea:focus { border-color: var(--accent); }
  #send {
    font: inherit;
    padding: 11px 22px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(44, 44, 42, 0.32);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 20;
  }
  .overlay.open { display: flex; }
  .panel {
    background: var(--surface);
    border-radius: 16px;
    width: 100%;
    max-width: 460px;
    max-height: 100%;
    overflow-y: auto;
    padding: 22px 24px 20px;
  }
  .panel h2 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .panel .sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%;
    font: inherit;
    padding: 9px 12px;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .field .tip { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .field .tip a { color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .panel .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .panel .actions button {
    font: inherit;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    border: 0.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .panel .actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .panel .actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .panel .notice {
    font-size: 12px;
    color: var(--danger);
    margin-top: 12px;
    display: none;
  }
  .panel .notice.show { display: block; }

  body.dragover::after {
    content: "松开鼠标即可上传文档";
    position: fixed;
    inset: 12px;
    border: 2px dashed var(--accent);
    border-radius: 16px;
    background: rgba(83, 74, 183, 0.06);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>个人 RAG 知识库助手</h1>
    <input type="file" id="filePicker" multiple hidden
           accept=".md,.markdown,.txt,.pdf,.docx,.pptx,.py,.json,.csv,.yaml,.yml">
    <button id="upload">上传文档</button>
    <button id="ingest">重建索引</button>
    <button id="settingsBtn">设置</button>
    <span class="status" id="status">就绪</span>
  </header>

  <main id="messages">
    <div class="hint">
      先在右上角「设置」里填入 API Key；然后上传或拖入文档（支持
      <code>PDF</code> <code>Word</code> <code>PPT</code> <code>Markdown</code>
      <code>代码 / 文本</code>），上传后会自动建库。完成后即可在下方提问。
    </div>
  </main>

  <footer>
    <textarea id="input" rows="1" placeholder="基于你的知识库提问…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2>设置</h2>
    <div class="sub">保存后会写入项目根目录的 <code>.env</code>，并立即生效，无需重启服务。</div>

    <div class="field">
      <label for="keyInput">智谱 API Key</label>
      <input type="password" id="keyInput" autocomplete="off" spellcheck="false"
             placeholder="粘贴你的 API Key">
      <div class="tip" id="keyTip">
        申请地址：<a href="https://bigmodel.cn/usercenter/apikeys" target="_blank" rel="noopener">bigmodel.cn/usercenter/apikeys</a>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="chatModelInput">对话模型</label>
        <input id="chatModelInput" spellcheck="false" placeholder="glm-5.2">
      </div>
      <div class="field">
        <label for="embedModelInput">Embedding 模型</label>
        <input id="embedModelInput" spellcheck="false" placeholder="embedding-3">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="embedDimInput">向量维度</label>
        <input id="embedDimInput" type="number" min="16" max="4096" placeholder="1024">
      </div>
      <div class="field">
        <label for="topKInput">召回条数 Top-K</label>
        <input id="topKInput" type="number" min="1" max="50" placeholder="5">
      </div>
    </div>

    <div class="notice" id="panelNotice"></div>

    <div class="actions">
      <button id="cancelBtn">取消</button>
      <button id="saveBtn" class="primary">保存</button>
    </div>
  </div>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const ingestBtn = document.getElementById('ingest');
const uploadBtn = document.getElementById('upload');
const settingsBtn = document.getElementById('settingsBtn');
const filePicker = document.getElementById('filePicker');
const statusEl = document.getElementById('status');

const overlay = document.getElementById('overlay');
const keyInput = document.getElementById('keyInput');
const chatModelInput = document.getElementById('chatModelInput');
const embedModelInput = document.getElementById('embedModelInput');
const embedDimInput = document.getElementById('embedDimInput');
const topKInput = document.getElementById('topKInput');
const saveBtn = document.getElementById('saveBtn');
const cancelBtn = document.getElementById('cancelBtn');
const panelNotice = document.getElementById('panelNotice');

function setStatus(text) { statusEl.textContent = text; }

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  return bubble;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderCitations(bubble, citations) {
  if (!citations || !citations.length) return;
  const box = document.createElement('div');
  box.className = 'citations';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = '引用来源（点击展开原文）';
  box.appendChild(label);

  for (const item of citations) {
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    const loc = item.location ? ' · ' + item.location : '';
    const score = typeof item.score === 'number' ? ' · 相似度 ' + Math.round(item.score * 100) + '%' : '';
    summary.innerHTML =
      '<span class="src">[' + item.index + '] ' + escapeHtml(item.source) + '</span>' +
      '<span class="loc">' + escapeHtml(loc + score) + '</span>';
    const pre = document.createElement('pre');
    pre.textContent = item.text;
    details.appendChild(summary);
    details.appendChild(pre);
    box.appendChild(details);
  }
  bubble.appendChild(box);
}

async function postJSON(url, payload) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.detail || '请求失败');
  return data;
}

function indexSummary(data) {
  return '新增 ' + data.added.length + ' 个文件，更新 ' + data.updated.length +
    ' 个，移除 ' + data.removed.length + ' 个，未变化 ' + data.unchanged.length +
    ' 个，写入 ' + data.chunks_written + ' 个片段。';
}

async function ask() {
  const question = input.value.trim();
  if (!question) return;

  addMessage('user', question);
  input.value = '';
  autoGrow();

  sendBtn.disabled = true;
  setStatus('检索中…');
  const bubble = addMessage('assistant', '正在检索知识库…');

  try {
    const data = await postJSON('/query', { question });
    bubble.textContent = data.answer;
    renderCitations(bubble, data.citations);
    setStatus('就绪');
  } catch (err) {
    bubble.textContent = '出错了：' + err.message;
    setStatus('出错');
  } finally {
    sendBtn.disabled = false;
    messages.scrollTop = messages.scrollHeight;
  }
}

async function rebuildIndex() {
  ingestBtn.disabled = true;
  setStatus('正在建库…');
  try {
    const data = await postJSON('/ingest', { force: false });
    setStatus('建库完成');
    addMessage('assistant', '建库完成：' + indexSummary(data));
  } catch (err) {
    addMessage('assistant', '建库出错：' + err.message);
    setStatus('出错');
  } finally {
    ingestBtn.disabled = false;
  }
}

async function uploadFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;

  const form = new FormData();
  files.forEach(file => form.append('files', file));

  uploadBtn.disabled = true;
  setStatus('上传中…');
  try {
    const resp = await fetch('/upload', { method: 'POST', body: form });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '上传失败');

    setStatus('建库完成');
    let text = '已上传 ' + data.saved.length + ' 个文件：' + data.saved.join('、') +
      '\n' + indexSummary(data);
    if (data.skipped && data.skipped.length) {
      text += '\n已跳过不支持的文件：' + data.skipped.join('、');
    }
    addMessage('assistant', text);
  } catch (err) {
    addMessage('assistant', '上传出错：' + err.message);
    setStatus('出错');
  } finally {
    uploadBtn.disabled = false;
    filePicker.value = '';
  }
}

function showNotice(text) {
  panelNotice.textContent = text;
  panelNotice.classList.add('show');
}

function hideNotice() {
  panelNotice.textContent = '';
  panelNotice.classList.remove('show');
}

function fillForm(data) {
  chatModelInput.value = data.chat_model || '';
  embedModelInput.value = data.embed_model || '';
  embedDimInput.value = data.embed_dim || '';
  topKInput.value = data.top_k || '';
  keyInput.value = '';
  keyInput.placeholder = data.api_key_set
    ? '已配置 ' + data.api_key_hint + '（留空则不修改）'
    : '粘贴你的 API Key';
  settingsBtn.classList.toggle('warn', !data.api_key_set);
  settingsBtn.textContent = data.api_key_set ? '设置' : '设置 API';
}

function openSettings() {
  hideNotice();
  overlay.classList.add('open');
  keyInput.focus();
}

function closeSettings() { overlay.classList.remove('open'); }

async function loadSettings() {
  try {
    const resp = await fetch('/settings');
    const data = await resp.json();
    fillForm(data);
    if (!data.api_key_set) {
      openSettings();
      addMessage('assistant', '还没有配置 API Key，请在上方的设置面板里填入后保存。');
    }
  } catch (err) {
    setStatus('读取设置失败');
  }
}

async function saveSettings() {
  const payload = {
    chat_model: chatModelInput.value.trim() || null,
    embed_model: embedModelInput.value.trim() || null,
    top_k: topKInput.value ? Number(topKInput.value) : null,
    embed_dim: embedDimInput.value ? Number(embedDimInput.value) : null
  };
  const key = keyInput.value.trim();
  if (key) payload.api_key = key;

  saveBtn.disabled = true;
  try {
    const data = await postJSON('/settings', payload);
    fillForm(data);
    setStatus('已保存');
    let text = '设置已保存' + (data.api_key_set ? '，API Key：' + data.api_key_hint : '') + '。';
    if (data.needs_reindex) {
      text += '\n注意：Embedding 模型或维度变了，旧索引已失效，请点「重建索引」。';
    }
    closeSettings();
    addMessage('assistant', text);
  } catch (err) {
    showNotice('保存失败：' + err.message);
  } finally {
    saveBtn.disabled = false;
  }
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}

sendBtn.addEventListener('click', ask);
ingestBtn.addEventListener('click', rebuildIndex);
uploadBtn.addEventListener('click', () => filePicker.click());
filePicker.addEventListener('change', () => uploadFiles(filePicker.files));
settingsBtn.addEventListener('click', openSettings);
cancelBtn.addEventListener('click', closeSettings);
saveBtn.addEventListener('click', saveSettings);
overlay.addEventListener('click', event => { if (event.target === overlay) closeSettings(); });
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeSettings();
});
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    ask();
  }
});

window.addEventListener('dragover', event => {
  event.preventDefault();
  document.body.classList.add('dragover');
});
window.addEventListener('dragleave', event => {
  if (event.relatedTarget === null) document.body.classList.remove('dragover');
});
window.addEventListener('drop', event => {
  event.preventDefault();
  document.body.classList.remove('dragover');
  uploadFiles(event.dataTransfer.files);
});

loadSettings();
</script>
</body>
</html>
