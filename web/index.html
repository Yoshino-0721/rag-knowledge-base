<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人 RAG 知识库助手</title>
<style>
  :root {
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --border: #E3E2DE;
    --text: #2C2C2A;
    --muted: #6B6A66;
    --accent: #534AB7;
    --accent-soft: #EEEDFE;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .app {
    max-width: 860px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 0 14px;
    border-bottom: 0.5px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 500; margin: 0; margin-right: auto; }
  header .status { font-size: 12px; color: var(--muted); min-width: 72px; text-align: right; }
  header button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 8px;
    border: 0.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  header button:hover { border-color: var(--accent); color: var(--accent); }
  header button:disabled { opacity: 0.5; cursor: not-allowed; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .hint {
    border: 0.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .hint code {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 12px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; }
  .msg.assistant .bubble {
    background: var(--surface);
    border: 0.5px solid var(--border);
    max-width: 100%;
    width: 100%;
  }
  .citations { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .citations .label { font-size: 12px; color: var(--muted); }
  details {
    border: 0.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    padding: 8px 12px;
  }
  details summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--accent);
    outline: none;
  }
  details summary .src { color: var(--text); font-weight: 500; }
  details summary .loc { color: var(--muted); }
  details pre {
    margin: 10px 0 2px;
    white-space: pre-wrap;
    word-break: break-word;
    font: 12px/1.6 inherit;
    color: var(--muted);
  }
  footer {
    padding: 14px 0 20px;
    border-top: 0.5px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    padding: 11px 14px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    max-height: 140px;
  }
  textarea:focus { border-color: var(--accent); }
  #send {
    font: inherit;
    padding: 11px 22px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  body.dragover::after {
    content: "松开鼠标即可上传文档";
    position: fixed;
    inset: 12px;
    border: 2px dashed var(--accent);
    border-radius: 16px;
    background: rgba(83, 74, 183, 0.06);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>个人 RAG 知识库助手</h1>
    <input type="file" id="filePicker" multiple hidden
           accept=".md,.markdown,.txt,.pdf,.docx,.pptx,.py,.json,.csv,.yaml,.yml">
    <button id="upload">上传文档</button>
    <button id="ingest">重建索引</button>
    <span class="status" id="status">就绪</span>
  </header>

  <main id="messages">
    <div class="hint">
      点击右上角「上传文档」选择文件，或直接把文件拖进本页面；支持
      <code>PDF</code> <code>Word</code> <code>PPT</code> <code>Markdown</code>
      <code>代码 / 文本</code>。上传后会自动建库，也可以手动放进
      <code>data/</code> 目录再点「重建索引」。
    </div>
  </main>

  <footer>
    <textarea id="input" rows="1" placeholder="基于你的知识库提问…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </footer>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const ingestBtn = document.getElementById('ingest');
const uploadBtn = document.getElementById('upload');
const filePicker = document.getElementById('filePicker');
const statusEl = document.getElementById('status');

function setStatus(text) { statusEl.textContent = text; }

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  return bubble;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderCitations(bubble, citations) {
  if (!citations || !citations.length) return;
  const box = document.createElement('div');
  box.className = 'citations';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = '引用来源（点击展开原文）';
  box.appendChild(label);

  for (const item of citations) {
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    const loc = item.location ? ' · ' + item.location : '';
    const score = typeof item.score === 'number' ? ' · 相似度 ' + Math.round(item.score * 100) + '%' : '';
    summary.innerHTML =
      '<span class="src">[' + item.index + '] ' + escapeHtml(item.source) + '</span>' +
      '<span class="loc">' + escapeHtml(loc + score) + '</span>';
    const pre = document.createElement('pre');
    pre.textContent = item.text;
    details.appendChild(summary);
    details.appendChild(pre);
    box.appendChild(details);
  }
  bubble.appendChild(box);
}

async function postJSON(url, payload) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.detail || '请求失败');
  return data;
}

function indexSummary(data) {
  return '新增 ' + data.added.length + ' 个文件，更新 ' + data.updated.length +
    ' 个，移除 ' + data.removed.length + ' 个，未变化 ' + data.unchanged.length +
    ' 个，写入 ' + data.chunks_written + ' 个片段。';
}

async function ask() {
  const question = input.value.trim();
  if (!question) return;

  addMessage('user', question);
  input.value = '';
  autoGrow();

  sendBtn.disabled = true;
  setStatus('检索中…');
  const bubble = addMessage('assistant', '正在检索知识库…');

  try {
    const data = await postJSON('/query', { question });
    bubble.textContent = data.answer;
    renderCitations(bubble, data.citations);
    setStatus('就绪');
  } catch (err) {
    bubble.textContent = '出错了：' + err.message;
    setStatus('出错');
  } finally {
    sendBtn.disabled = false;
    messages.scrollTop = messages.scrollHeight;
  }
}

async function rebuildIndex() {
  ingestBtn.disabled = true;
  setStatus('正在建库…');
  try {
    const data = await postJSON('/ingest', { force: false });
    setStatus('建库完成');
    addMessage('assistant', '建库完成：' + indexSummary(data));
  } catch (err) {
    addMessage('assistant', '建库出错：' + err.message);
    setStatus('出错');
  } finally {
    ingestBtn.disabled = false;
  }
}

async function uploadFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;

  const form = new FormData();
  files.forEach(file => form.append('files', file));

  uploadBtn.disabled = true;
  setStatus('上传中…');
  try {
    const resp = await fetch('/upload', { method: 'POST', body: form });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '上传失败');

    setStatus('建库完成');
    let text = '已上传 ' + data.saved.length + ' 个文件：' + data.saved.join('、') +
      '\n' + indexSummary(data);
    if (data.skipped && data.skipped.length) {
      text += '\n已跳过不支持的文件：' + data.skipped.join('、');
    }
    addMessage('assistant', text);
  } catch (err) {
    addMessage('assistant', '上传出错：' + err.message);
    setStatus('出错');
  } finally {
    uploadBtn.disabled = false;
    filePicker.value = '';
  }
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}

sendBtn.addEventListener('click', ask);
ingestBtn.addEventListener('click', rebuildIndex);
uploadBtn.addEventListener('click', () => filePicker.click());
filePicker.addEventListener('change', () => uploadFiles(filePicker.files));
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    ask();
  }
});

window.addEventListener('dragover', event => {
  event.preventDefault();
  document.body.classList.add('dragover');
});
window.addEventListener('dragleave', event => {
  if (event.relatedTarget === null) document.body.classList.remove('dragover');
});
window.addEventListener('drop', event => {
  event.preventDefault();
  document.body.classList.remove('dragover');
  uploadFiles(event.dataTransfer.files);
});
</script>
</body>
</html>
